[package]
name 		    = "vcu-firm"
edition 	    =   "2021"
version 	    = "0.1.0"
rust-version 	= "1.82"
resolver 	    = "2"

[[bin]]
name 		    = "vcu-firm"
harness 	    = false

[profile.release]
opt-level 	    = "s"

[profile.dev]
debug 		    = true
opt-level 	    = "z"

[dependencies]
log 		    = "0.4"
esp-idf-svc 	= { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time 	= { version = "0.5", features = ["generic-queue-8"] }
esp-idf-hal 	= "0.46.2"

[build-dependencies]
embuild 	    = "0.33"
